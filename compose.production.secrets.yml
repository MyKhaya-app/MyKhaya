# PROD file-backed secrets overlay (MK-SEC-001 v1.2). PROD only.
#
# Layered last, after compose.production.service-env.yml, and only by
# infrastructure/scripts/prod-config-mode.sh when the protected state
# /etc/mykhaya/prod/.secrets-state selects it (prod-security-migrate.sh moves
# that state). In this mode MYKHAYA_PROD_CONFIG_ROOT points at the generated
# file-backed root (<PROD root>/file-backed), whose env files hold no
# credentials.
#
# Every credential is a Compose file secret, mounted read-only at
# /run/secrets/<name> into exactly the services granted it. The grants are
# enforced three times: by service_env_contract.py (--profile prod-secrets) on
# the merged model, by each process's MYKHAYA_PROCESS_ROLE at startup, and by
# the file ownership checked before every deployment.
#
# Compose bind-mounts file secrets and ignores uid/gid/mode for them, so access
# is decided by the files' own ownership (root:10001 for the application,
# root:70 for PostgreSQL, 0440). A credential that is not configured is an empty
# file that no setting refers to.
#
# The field keyrings and the Apple key keep their existing read-only directory
# mounts (compose.production.service-env.yml). redis, web and caddy are not
# mentioned here, so Compose never recreates them for this change. No volume,
# network, port or image changes.

services:
  api:
    environment:
      MYKHAYA_PROCESS_ROLE: api
    secrets:
      - secret_key
      - app_db_password
      - smtp_password
      - vapid_private_key
      - apple_private_key
      - google_client_secret
      - stripe_secret_key
      - stripe_webhook_secret
      - dvla_uat_api_key
      - dvla_production_api_key
      - dvsa_client_id
      - dvsa_client_secret
      - dvsa_api_key

  worker:
    environment:
      MYKHAYA_PROCESS_ROLE: worker
    secrets:
      - secret_key
      - app_db_password
      - smtp_password
      - vapid_private_key
      - apns_private_key
      - fcm_private_key

  scheduler:
    environment:
      MYKHAYA_PROCESS_ROLE: scheduler
    secrets:
      - secret_key
      - app_db_password
      - smtp_password
      - stripe_secret_key
      - monitoring_watchdog_url

  migrate:
    # The migrate role holds the migration database credential and nothing else:
    # no application key, and none of the installation settings, key paths or
    # pinned APNs, Apple and keyring names.
    env_file: !override
      - "${MYKHAYA_PROD_CONFIG_ROOT:?}/migrate.env"
    environment: !override
      MYKHAYA_ENVIRONMENT: production
      MYKHAYA_BUILD_CHANNEL: stable
      MYKHAYA_VERSION: "${MYKHAYA_VERSION:-dev}"
      MYKHAYA_COMMIT_SHA: "${MYKHAYA_COMMIT_SHA:-unknown}"
      MYKHAYA_BUILD_TIME: "${MYKHAYA_BUILD_TIME:-unknown}"
      MYKHAYA_PROCESS_ROLE: migrate
    secrets:
      - migration_db_password

  postgres:
    # Read only when an empty data directory is initialised, except that the
    # image reads POSTGRES_PASSWORD_FILE at every start. An existing volume is
    # never re-initialised and its role passwords never change. Replacing the
    # password variables recreates this container once, on the same volume.
    environment: !override
      POSTGRES_DB: mykhaya
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_admin_password
      MYKHAYA_MIGRATION_DB_PASSWORD_FILE: /run/secrets/postgres_migration_password
      MYKHAYA_DB_PASSWORD_FILE: /run/secrets/postgres_app_password
    secrets:
      - postgres_admin_password
      - postgres_migration_password
      - postgres_app_password

secrets:
  secret_key: { file: "${MYKHAYA_PROD_CONFIG_ROOT:?Set by prod-config-mode.sh}/secrets/app/secret_key" }
  app_db_password: { file: "${MYKHAYA_PROD_CONFIG_ROOT:?}/secrets/app/app_db_password" }
  migration_db_password: { file: "${MYKHAYA_PROD_CONFIG_ROOT:?}/secrets/app/migration_db_password" }
  smtp_password: { file: "${MYKHAYA_PROD_CONFIG_ROOT:?}/secrets/app/smtp_password" }
  vapid_private_key: { file: "${MYKHAYA_PROD_CONFIG_ROOT:?}/secrets/app/vapid_private_key" }
  apns_private_key: { file: "${MYKHAYA_PROD_CONFIG_ROOT:?}/secrets/app/apns_private_key" }
  fcm_private_key: { file: "${MYKHAYA_PROD_CONFIG_ROOT:?}/secrets/app/fcm_private_key" }
  apple_private_key: { file: "${MYKHAYA_PROD_CONFIG_ROOT:?}/secrets/app/apple_private_key" }
  google_client_secret: { file: "${MYKHAYA_PROD_CONFIG_ROOT:?}/secrets/app/google_client_secret" }
  stripe_secret_key: { file: "${MYKHAYA_PROD_CONFIG_ROOT:?}/secrets/app/stripe_secret_key" }
  stripe_webhook_secret: { file: "${MYKHAYA_PROD_CONFIG_ROOT:?}/secrets/app/stripe_webhook_secret" }
  dvla_uat_api_key: { file: "${MYKHAYA_PROD_CONFIG_ROOT:?}/secrets/app/dvla_uat_api_key" }
  dvla_production_api_key: { file: "${MYKHAYA_PROD_CONFIG_ROOT:?}/secrets/app/dvla_production_api_key" }
  dvsa_client_id: { file: "${MYKHAYA_PROD_CONFIG_ROOT:?}/secrets/app/dvsa_client_id" }
  dvsa_client_secret: { file: "${MYKHAYA_PROD_CONFIG_ROOT:?}/secrets/app/dvsa_client_secret" }
  dvsa_api_key: { file: "${MYKHAYA_PROD_CONFIG_ROOT:?}/secrets/app/dvsa_api_key" }
  monitoring_watchdog_url: { file: "${MYKHAYA_PROD_CONFIG_ROOT:?}/secrets/app/monitoring_watchdog_url" }
  postgres_admin_password: { file: "${MYKHAYA_PROD_CONFIG_ROOT:?}/secrets/postgres/postgres_admin_password" }
  postgres_migration_password: { file: "${MYKHAYA_PROD_CONFIG_ROOT:?}/secrets/postgres/postgres_migration_password" }
  postgres_app_password: { file: "${MYKHAYA_PROD_CONFIG_ROOT:?}/secrets/postgres/postgres_app_password" }
