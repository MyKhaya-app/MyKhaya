    <style>

      body {

        margin: 0;

    <!--
      This file is never the real MyKhaya UI. Capacitor requires a local
      webDir even when server.url points at a live remote origin (see
      ../capacitor.config.ts) — this is only what briefly shows before the
      WebView navigates there, or if that navigation fails outright (e.g.
      no network at launch, since server.url loading has no automatic
      retry/offline UI of its own the way the PWA's own service worker
      does for a browser tab).
