apply plugin: 'com.android.application'

def developmentFirebaseConfig = file('src/development/google-services.json')
def productionFirebaseConfig = file('src/production/google-services.json')
def rootFirebaseConfig = file('google-services.json')
def releaseKeystorePropertiesFile = file('keystore.properties')
def releaseKeystoreProperties = new Properties()
if (releaseKeystorePropertiesFile.isFile()) {
    releaseKeystorePropertiesFile.withInputStream { releaseKeystoreProperties.load(it) }
}
def requestedGradleTasks = gradle.startParameter.taskNames.collect { it.toLowerCase() }
def developmentBuildRequested = requestedGradleTasks.any { it.contains('development') }
def productionBuildRequested = requestedGradleTasks.any { it.contains('production') }

def releaseSigningValue = { String propertyName, String environmentName ->
    def environmentValue = System.getenv(environmentName)
    if (environmentValue != null && !environmentValue.trim().isEmpty()) {
        return environmentValue.trim()
    }
    def propertyValue = releaseKeystoreProperties.getProperty(propertyName)
    return propertyValue == null ? null : propertyValue.trim()
}

def releaseStoreFile = releaseSigningValue('storeFile', 'MYKHAYA_UPLOAD_KEYSTORE')
def releaseStorePassword = releaseSigningValue('storePassword', 'MYKHAYA_UPLOAD_STORE_PASSWORD')
def releaseKeyAlias = releaseSigningValue('keyAlias', 'MYKHAYA_UPLOAD_KEY_ALIAS')
def releaseKeyPassword = releaseSigningValue('keyPassword', 'MYKHAYA_UPLOAD_KEY_PASSWORD')
def releaseSigningConfigured = [releaseStoreFile, releaseStorePassword, releaseKeyAlias, releaseKeyPassword]
    .every { it != null && !it.isEmpty() }

def verifyCapacitorConfiguration = { File configFile, String environment, String expectedApplicationId, String expectedFrontend, String expectedHost ->
    if (!configFile.isFile()) {
        throw new GradleException(
            "Missing generated Capacitor configuration for ${environment} at ${configFile}. " +
            "Run the matching MYKHAYA_ANDROID_ENV cap sync before building."
        )
    }

    def config = new groovy.json.JsonSlurper().parse(configFile)
    def server = config.server
    def actualFrontend = server?.url
    def actualHosts = server?.allowNavigation

    if (config.appId != expectedApplicationId) {
        throw new GradleException(
            "${environment} Capacitor configuration has appId ${config.appId}; expected ${expectedApplicationId}. " +
            "Run the matching MYKHAYA_ANDROID_ENV cap sync before building."
        )
    }
    if (actualFrontend != expectedFrontend) {
        throw new GradleException(
            "${environment} Capacitor configuration points at ${actualFrontend}; expected ${expectedFrontend}. " +
            "Run MYKHAYA_ANDROID_ENV=${environment == 'PROD' ? 'production' : 'development'} npx cap sync android."
        )
    }
    if (actualHosts != [expectedHost]) {
        throw new GradleException(
            "${environment} Capacitor configuration has an unexpected allowNavigation host list; " +
            "expected only ${expectedHost}. Run the matching MYKHAYA_ANDROID_ENV cap sync before building."
        )
    }
    if (server?.cleartext != false) {
        throw new GradleException("${environment} Capacitor configuration must keep cleartext disabled.")
    }
}

android {
    namespace = "app.mykhaya.mobile"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "app.mykhaya.mobile"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 31
        versionName "0.1.31"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    flavorDimensions "environment"
    productFlavors {
        development {
            dimension "environment"
            applicationId "app.mykhaya.mobile"
            versionNameSuffix "-dev"
            resValue "string", "app_name", "MyKhaya-Dev"
            manifestPlaceholders = [appLinkHost: "dev.mykhaya.app"]
        }
        production {
            dimension "environment"
            applicationId "app.mykhaya.mobile.prod"
            resValue "string", "app_name", "MyKhaya"
            manifestPlaceholders = [appLinkHost: "mykhaya.app"]
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (releaseSigningConfigured) {
                signingConfig signingConfigs.create('releaseUpload') {
                    storeFile file(releaseStoreFile)
                    storePassword releaseStorePassword
                    keyAlias releaseKeyAlias
                    keyPassword releaseKeyPassword
                }
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def firebaseConfigForRequestedVariant = rootFirebaseConfig.isFile() ||
        (developmentBuildRequested && developmentFirebaseConfig.isFile()) ||
        (productionBuildRequested && productionFirebaseConfig.isFile())
    if (firebaseConfigForRequestedVariant) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("Firebase configuration could not be inspected; google-services plugin not applied. Push Notifications won't work")
}

tasks.register('verifyDevelopmentFirebaseConfiguration') {
    doLast {
        if (!developmentFirebaseConfig.isFile()) {
            throw new GradleException(
                "Missing DEV Firebase configuration at ${developmentFirebaseConfig}. " +
                "Download the DEV Firebase google-services.json for package app.mykhaya.mobile to this path."
            )
        }

        def config = new groovy.json.JsonSlurper().parse(developmentFirebaseConfig)
        def projectId = config.project_info?.project_id
        def matchingClient = (config.client ?: []).find { client ->
            client.client_info?.android_client_info?.package_name == 'app.mykhaya.mobile'
        }

        if (!(projectId instanceof String) || projectId.trim().isEmpty()) {
            throw new GradleException("DEV Firebase configuration has no project_info.project_id: ${developmentFirebaseConfig}")
        }
        if (matchingClient == null) {
            throw new GradleException(
                "DEV Firebase configuration does not contain an Android client for app.mykhaya.mobile: ${developmentFirebaseConfig}"
            )
        }

        logger.lifecycle("DEV Firebase configuration verified for app.mykhaya.mobile (project ${projectId})")
    }
}

tasks.register('verifyProductionFirebaseConfiguration') {
    doLast {
        if (!productionFirebaseConfig.isFile()) {
            throw new GradleException(
                "Missing PROD Firebase configuration at ${productionFirebaseConfig}. " +
                "Download the PROD Firebase google-services.json for package app.mykhaya.mobile.prod to this path; do not use the DEV file."
            )
        }

        def config = new groovy.json.JsonSlurper().parse(productionFirebaseConfig)
        def projectId = config.project_info?.project_id
        def matchingClient = (config.client ?: []).find { client ->
            client.client_info?.android_client_info?.package_name == 'app.mykhaya.mobile.prod'
        }

        if (!(projectId instanceof String) || projectId.trim().isEmpty()) {
            throw new GradleException("PROD Firebase configuration has no project_info.project_id: ${productionFirebaseConfig}")
        }
        if (projectId == 'mykhaya-dev-faf55') {
            throw new GradleException(
                "PROD Firebase configuration points at the DEV project mykhaya-dev-faf55; download the PROD Firebase file instead."
            )
        }
        if (matchingClient == null) {
            throw new GradleException(
                "PROD Firebase configuration does not contain an Android client for app.mykhaya.mobile.prod: ${productionFirebaseConfig}"
            )
        }

        logger.lifecycle("PROD Firebase configuration verified for app.mykhaya.mobile.prod (project ${projectId})")
    }
}

tasks.register('verifyProductionReleaseSigning') {
    doLast {
        if (!releaseSigningConfigured) {
            throw new GradleException(
                "Missing release upload signing configuration. Supply apps/android-shell/android/app/keystore.properties " +
                "or MYKHAYA_UPLOAD_KEYSTORE, MYKHAYA_UPLOAD_STORE_PASSWORD, MYKHAYA_UPLOAD_KEY_ALIAS, and " +
                "MYKHAYA_UPLOAD_KEY_PASSWORD locally; never commit them."
            )
        }
        def keystore = file(releaseStoreFile)
        if (!keystore.isFile()) {
            throw new GradleException("Release upload keystore does not exist: ${keystore}")
        }
    }
}

tasks.register('verifyDevelopmentCapacitorConfiguration') {
    doLast {
        verifyCapacitorConfiguration(file('src/main/assets/capacitor.config.json'), 'DEV', 'app.mykhaya.mobile', 'https://dev.mykhaya.app', 'dev.mykhaya.app')
        logger.lifecycle('DEV Capacitor configuration verified for dev.mykhaya.app')
    }
}

tasks.register('verifyProductionCapacitorConfiguration') {
    doLast {
        verifyCapacitorConfiguration(file('src/main/assets/capacitor.config.json'), 'PROD', 'app.mykhaya.mobile.prod', 'https://mykhaya.app', 'mykhaya.app')
        logger.lifecycle('PROD Capacitor configuration verified for mykhaya.app')
    }
}

tasks.matching { it.name in ['preDevelopmentDebugBuild', 'preDevelopmentReleaseBuild'] }.configureEach {
    dependsOn tasks.named('verifyDevelopmentFirebaseConfiguration')
    dependsOn tasks.named('verifyDevelopmentCapacitorConfiguration')
}

tasks.matching { it.name in ['preProductionDebugBuild', 'preProductionReleaseBuild'] }.configureEach {
    dependsOn tasks.named('verifyProductionFirebaseConfiguration')
    dependsOn tasks.named('verifyProductionCapacitorConfiguration')
}

tasks.matching { it.name == 'preProductionReleaseBuild' }.configureEach {
    dependsOn tasks.named('verifyProductionReleaseSigning')
}

// Re-check the merged asset that is actually consumed by the Android variant.
tasks.matching { it.name == 'mergeProductionReleaseAssets' }.configureEach {
    doLast {
        verifyCapacitorConfiguration(file("${buildDir}/intermediates/assets/productionRelease/mergeProductionReleaseAssets/capacitor.config.json"), 'PROD', 'app.mykhaya.mobile.prod', 'https://mykhaya.app', 'mykhaya.app')
    }
}

tasks.matching { it.name == 'mergeDevelopmentDebugAssets' }.configureEach {
    doLast {
        verifyCapacitorConfiguration(file("${buildDir}/intermediates/assets/developmentDebug/mergeDevelopmentDebugAssets/capacitor.config.json"), 'DEV', 'app.mykhaya.mobile', 'https://dev.mykhaya.app', 'dev.mykhaya.app')
    }
}
