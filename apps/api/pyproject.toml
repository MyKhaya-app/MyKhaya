[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "mykhaya-api"
version = "0.1.0"
description = "MyKhaya modular monolith API"
requires-python = ">=3.13"
dependencies = [
  "alembic>=1.16,<2",
  "asyncpg>=0.30,<1",
  "cryptography>=43,<45",
  "fastapi>=0.116,<1",
  "email-validator>=2.2,<3",
  "greenlet>=3.2,<4",
  "httpx>=0.28,<1",
  "pwdlib[argon2]>=0.2,<1",
  "pydantic-settings>=2.10,<3",
  "pywebpush>=2,<3",
  "redis>=6.2,<7",
  "sqlalchemy[asyncio]>=2.0.41,<3",
  "structlog>=25.4,<26",
  "uvicorn[standard]>=0.35,<1"
]

[project.optional-dependencies]
dev = [
  "mypy>=1.17,<2",
  "pip-audit>=2.9,<3",
  "pytest>=9.0.3,<10",
  "pytest-asyncio>=1.1,<2",
  "pytest-cov>=6.2,<7",
  "ruff>=0.12,<1"
]

[project.scripts]
mykhaya-worker = "mykhaya.worker:main"
mykhaya-scheduler = "mykhaya.scheduler:main"

[tool.hatch.build.targets.wheel]
packages = ["mykhaya"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
addopts = "--strict-markers --cov=mykhaya --cov-report=term-missing"
cache_dir = "/tmp/.pytest_cache"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S"]
ignore = ["S101", "B008"]

[tool.ruff.lint.per-file-ignores]
"mykhaya/models.py" = ["S105"]
"mykhaya/security.py" = ["S106"]
"mykhaya/routers/invitations.py" = ["S106"]
"tests/*.py" = ["S105", "S106"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["pywebpush.*", "py_vapid.*"]
ignore_missing_imports = true
