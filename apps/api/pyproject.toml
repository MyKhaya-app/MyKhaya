[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "mykhaya-api"
version = "0.1.0"
description = "MyKhaya modular monolith API"
requires-python = ">=3.13"
dependencies = [
  "alembic>=1.16,<2",
  "asyncpg>=0.30,<1",
  "cryptography>=44.0.3,<51",
  "fastapi>=0.116,<1",
  "email-validator>=2.2,<3",
  "greenlet>=3.2,<4",
  "httpx>=0.28,<1",
  "pillow>=12.2,<13",
  "pillow-heif>=1.3,<2",
  "pwdlib[argon2]>=0.2,<1",
  "pydantic-settings>=2.10,<3",
  "pyotp>=2.9,<3",
  "python-multipart>=0.0.20,<1",
  "pywebpush>=2,<3",
  "redis>=6.2,<7",
  "sqlalchemy[asyncio]>=2.0.41,<3",
  "structlog>=25.4,<26",
  "uvicorn[standard]>=0.35,<1",
  "webauthn>=2.5,<3"
]

[project.optional-dependencies]
dev = [
  "mypy>=1.17,<2",
  "pip-audit>=2.9,<3",
  "pytest>=9.0.3,<10",
  "pytest-asyncio>=1.1,<2",
  "pytest-cov>=6.2,<7",
  "ruff>=0.12,<1"
]

[project.scripts]
mykhaya-worker = "mykhaya.worker:main"
mykhaya-scheduler = "mykhaya.scheduler:main"

[tool.hatch.build.targets.wheel]
packages = ["mykhaya"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
addopts = "--strict-markers --cov=mykhaya --cov-report=term-missing"
cache_dir = "/tmp/.pytest_cache"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S"]
ignore = ["S101", "B008"]

[tool.ruff.lint.per-file-ignores]
"mykhaya/models.py" = ["S105"]
"mykhaya/security.py" = ["S106"]
"mykhaya/routers/invitations.py" = ["S106"]
"tests/*.py" = ["S105", "S106"]
# Pytest fixtures imported from another test module and used as a same-named
# parameter (the standard way to share fixtures across test files without a
# conftest.py) look like shadowing to ruff's static analysis, but are how
# pytest's fixture injection is meant to work.
"tests/test_platform_mfa.py" = ["F811"]
"tests/test_platform_health_cards.py" = ["F811"]
"tests/test_platform_admin_invitations.py" = ["F811"]
"tests/test_platform_security_remediation.py" = ["F811"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["pywebpush.*", "py_vapid.*", "pillow_heif.*", "pyotp.*"]
ignore_missing_imports = true
