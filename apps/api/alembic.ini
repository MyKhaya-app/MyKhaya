[alembic]
script_location = migrations
prepend_sys_path = .
# Unused placeholder, deliberately password-free: migrations/env.py connects
# with MigrationSettings' URL object and never reads or writes this value.
sqlalchemy.url = postgresql+asyncpg://mykhaya_migrator@postgres:5432/mykhaya

[loggers]
keys = root,sqlalchemy,alembic
[handlers]
keys = console
[formatters]
keys = generic
[logger_root]
level = WARN
handlers = console
qualname =
[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine
[logger_alembic]
level = INFO
handlers =
qualname = alembic
[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic
[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
