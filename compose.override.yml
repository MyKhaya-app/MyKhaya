services:
  caddy:
    ports: ["127.0.0.1:3000:8080", "127.0.0.1:8080:8080"]
  mailpit:
    ports: ["127.0.0.1:8025:8025"]
  web:
    environment: { NODE_ENV: development }
  api:
    environment:
      MYKHAYA_ENVIRONMENT: development
      MYKHAYA_BUILD_CHANNEL: development
      MYKHAYA_COOKIE_SECURE: "false"
      MYKHAYA_ADMIN_URL: http://admin.localhost:8080
      MYKHAYA_STATUS_URL: http://status.localhost:8080
      MYKHAYA_CORS_ORIGINS: '["http://localhost:8080","http://admin.localhost:8080"]'
      MYKHAYA_TRUSTED_HOSTS: '["localhost","127.0.0.1","admin.localhost","status.localhost","api"]'
      MYKHAYA_ADMIN_ALLOWED_NETWORKS: '["127.0.0.0/8","::1/128","172.16.0.0/12"]'
      MYKHAYA_ADMIN_MFA_REQUIRED: "false"
  worker:
    environment:
      MYKHAYA_ENVIRONMENT: development
      MYKHAYA_BUILD_CHANNEL: development
      MYKHAYA_COOKIE_SECURE: "false"
      MYKHAYA_ADMIN_URL: http://admin.localhost:8080
      MYKHAYA_STATUS_URL: http://status.localhost:8080
      MYKHAYA_TRUSTED_HOSTS: '["localhost","127.0.0.1","admin.localhost","status.localhost","api"]'
  scheduler:
    environment:
      MYKHAYA_ENVIRONMENT: development
      MYKHAYA_BUILD_CHANNEL: development
      MYKHAYA_COOKIE_SECURE: "false"
      MYKHAYA_ADMIN_URL: http://admin.localhost:8080
      MYKHAYA_STATUS_URL: http://status.localhost:8080
      MYKHAYA_TRUSTED_HOSTS: '["localhost","127.0.0.1","admin.localhost","status.localhost","api"]'
