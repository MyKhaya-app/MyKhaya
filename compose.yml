name: mykhaya
services:
  caddy:
    image: caddy:2.10.0-alpine
    depends_on:
      web: { condition: service_healthy }
      api: { condition: service_healthy }
    volumes:
      [
        "./infrastructure/caddy/Caddyfile:/etc/caddy/Caddyfile:ro",
        "caddy_data:/data",
        "caddy_config:/config",
      ]
    networks: [edge, app]
    restart: unless-stopped
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs: [/tmp]
  web:
    build:
      {
        context: .,
        dockerfile: apps/web/Dockerfile,
        args:
          {
            MYKHAYA_VERSION: "${MYKHAYA_VERSION:-unknown}",
            MYKHAYA_COMMIT_SHA: "${MYKHAYA_COMMIT_SHA:-unknown}",
            MYKHAYA_BUILD_TIME: "${MYKHAYA_BUILD_TIME:-unknown}",
            MYKHAYA_BUILD_CHANNEL: "${MYKHAYA_BUILD_CHANNEL:-development}",
          },
      }
    environment:
      {
        API_INTERNAL_URL: "http://api:8000",
        NODE_ENV: production,
        MYKHAYA_VERSION: "${MYKHAYA_VERSION:-unknown}",
        MYKHAYA_COMMIT_SHA: "${MYKHAYA_COMMIT_SHA:-unknown}",
        MYKHAYA_BUILD_TIME: "${MYKHAYA_BUILD_TIME:-unknown}",
        MYKHAYA_BUILD_CHANNEL: "${MYKHAYA_BUILD_CHANNEL:-development}",
        MYKHAYA_EMAIL_DELIVERY_CONFIGURED: "${MYKHAYA_EMAIL_DELIVERY_CONFIGURED:-false}",
      }
    depends_on: { api: { condition: service_healthy } }
    networks: [app]
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs: [/tmp]
  api: &api
    build:
      {
        context: .,
        dockerfile: apps/api/Dockerfile,
        args:
          {
            MYKHAYA_VERSION: "${MYKHAYA_VERSION:-unknown}",
            MYKHAYA_COMMIT_SHA: "${MYKHAYA_COMMIT_SHA:-unknown}",
            MYKHAYA_BUILD_TIME: "${MYKHAYA_BUILD_TIME:-unknown}",
            MYKHAYA_BUILD_CHANNEL: "${MYKHAYA_BUILD_CHANNEL:-development}",
          },
      }
    env_file: [.env]
    environment:
      {
        MYKHAYA_DATABASE_URL: "postgresql+asyncpg://mykhaya_app:${MYKHAYA_DB_PASSWORD}@postgres:5432/mykhaya",
        MYKHAYA_VERSION: "${MYKHAYA_VERSION:-unknown}",
        MYKHAYA_COMMIT_SHA: "${MYKHAYA_COMMIT_SHA:-unknown}",
        MYKHAYA_BUILD_TIME: "${MYKHAYA_BUILD_TIME:-unknown}",
        MYKHAYA_BUILD_CHANNEL: "${MYKHAYA_BUILD_CHANNEL:-development}",
      }
    depends_on:
      {
        migrate: { condition: service_completed_successfully },
        redis: { condition: service_healthy },
      }
    # api/worker/scheduler are the application tier: they legitimately need outbound
    # internet access (SMTP relays, Web Push endpoints — FCM/APNs/Mozilla autopush —
    # OIDC providers, and future third-party integrations), not just inbound routing
    # from Caddy. `edge` is non-internal (unlike `app`/`data`) so Docker gives
    # containers on it a route out; this does NOT expose api to inbound traffic from
    # the internet, since only caddy publishes host ports — network membership alone
    # grants egress, not ingress. See docs/architecture/deployment-model.md and the
    # `networks:` block below for the full model.
    networks: [edge, app, data]
    # Profile avatars only (see mykhaya/avatars/) — a small, dedicated app-data volume,
    # not a general media/photo store. Only `api` actually reads/writes it; worker and
    # scheduler inherit the mount via this anchor but don't use it.
    volumes: ["avatar_data:/data/avatars"]
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs: [/tmp]
    stop_grace_period: 30s
  worker:
    <<: *api
    command: ["python", "-m", "mykhaya.worker"]
    healthcheck: { disable: true }
  scheduler:
    <<: *api
    command: ["python", "-m", "mykhaya.scheduler"]
    healthcheck: { disable: true }
  migrate:
    build:
      {
        context: .,
        dockerfile: apps/api/Dockerfile,
        args:
          {
            MYKHAYA_VERSION: "${MYKHAYA_VERSION:-unknown}",
            MYKHAYA_COMMIT_SHA: "${MYKHAYA_COMMIT_SHA:-unknown}",
            MYKHAYA_BUILD_TIME: "${MYKHAYA_BUILD_TIME:-unknown}",
            MYKHAYA_BUILD_CHANNEL: "${MYKHAYA_BUILD_CHANNEL:-development}",
          },
      }
    env_file: [.env]
    environment:
      {
        MYKHAYA_DATABASE_URL: "postgresql+asyncpg://mykhaya_migrator:${MYKHAYA_MIGRATION_DB_PASSWORD}@postgres:5432/mykhaya",
        MYKHAYA_VERSION: "${MYKHAYA_VERSION:-unknown}",
        MYKHAYA_COMMIT_SHA: "${MYKHAYA_COMMIT_SHA:-unknown}",
        MYKHAYA_BUILD_TIME: "${MYKHAYA_BUILD_TIME:-unknown}",
        MYKHAYA_BUILD_CHANNEL: "${MYKHAYA_BUILD_CHANNEL:-development}",
      }
    command: ["alembic", "upgrade", "head"]
    depends_on: { postgres: { condition: service_healthy } }
    networks: [data]
    restart: "no"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
  test:
    build: { context: ., dockerfile: apps/api/Dockerfile, target: test }
    env_file: [.env]
    environment:
      MYKHAYA_ENVIRONMENT: test
      MYKHAYA_DATABASE_URL: "postgresql+asyncpg://mykhaya_app:${MYKHAYA_DB_PASSWORD}@postgres:5432/mykhaya"
      MYKHAYA_RATE_LIMIT_LOGIN: "100"
      MYKHAYA_RATE_LIMIT_REGISTER: "300"
      MYKHAYA_EMAIL_VERIFICATION_ENABLED: "true"
      MYKHAYA_ADMIN_URL: "http://admin.localhost:8080"
      MYKHAYA_STATUS_URL: "http://status.localhost:8080"
      MYKHAYA_TRUSTED_HOSTS: '["localhost","127.0.0.1","admin.localhost","status.localhost"]'
      MYKHAYA_CORS_ORIGINS: '["http://localhost:8080","http://admin.localhost:8080"]'
      MYKHAYA_ADMIN_ALLOWED_NETWORKS: '["127.0.0.0/8","::1/128"]'
      COVERAGE_FILE: /tmp/.coverage
      RUFF_CACHE_DIR: /tmp/.ruff_cache
      MYPY_CACHE_DIR: /tmp/.mypy_cache
      MYKHAYA_AVATAR_STORAGE_DIR: /tmp/avatars
    command: ["python", "-m", "pytest"]
    depends_on:
      {
        migrate: { condition: service_completed_successfully },
        redis: { condition: service_healthy },
      }
    networks: [app, data]
    profiles: [tools]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs: [/tmp]
  postgres:
    image: postgres:17.5-alpine3.22
    env_file: [.env]
    environment:
      {
        POSTGRES_DB: mykhaya,
        POSTGRES_USER: postgres,
        POSTGRES_PASSWORD: "${MYKHAYA_POSTGRES_ADMIN_PASSWORD}",
      }
    volumes:
      [
        "postgres_data:/var/lib/postgresql/data",
        "./infrastructure/docker/init-db.sh:/docker-entrypoint-initdb.d/10-init.sh:ro",
      ]
    networks: [data]
    healthcheck:
      {
        test: [CMD-SHELL, "pg_isready -U postgres -d mykhaya"],
        interval: 5s,
        timeout: 3s,
        retries: 20,
      }
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
  redis:
    image: redis:8.0.3-alpine3.21
    command:
      [
        "redis-server",
        "--save",
        "60",
        "1",
        "--appendonly",
        "yes",
        "--maxmemory",
        "128mb",
        "--maxmemory-policy",
        "noeviction",
      ]
    volumes: ["redis_data:/data"]
    networks: [data]
    healthcheck:
      { test: [CMD, redis-cli, ping], interval: 5s, timeout: 3s, retries: 20 }
    restart: unless-stopped
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    security_opt: [no-new-privileges:true]
  mailpit:
    image: axllent/mailpit:v1.27.1
    networks: [data]
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
# Three-tier network model. `internal: true` controls a network's route to the
# outside world, not who can reach a service on it — inbound exposure is controlled
# separately, by which services publish host ports (only `caddy` does).
#
#   edge  (not internal) — Caddy's public-facing ingress, and the application tier's
#         (api/worker/scheduler) egress path for SMTP, Web Push, OIDC and other
#         outbound third-party integrations. Being on `edge` does not make a service
#         reachable from the internet by itself; only caddy publishes host ports.
#   app   (internal)     — east-west traffic between caddy/web/api/worker/scheduler
#         (e.g. web -> http://api:8000). No route out, no inbound from the internet.
#   data  (internal)     — postgres/redis/mailpit plus every service that talks to
#         them. Never internet-reachable in either direction — this is the tier the
#         original "internal-only database and Redis networks" design goal
#         (docs/architecture/deployment-model.md) actually describes.
#
# History: `app` was marked internal for every service on it, including
# api/worker/scheduler, from the first commit that introduced this file — with no
# ADR or design note discussing outbound access for the application tier. That
# blocked all egress for api/worker/scheduler (confirmed via DNS resolution failing
# inside the api container) and would have silently broken Web Push delivery to real
# devices (FCM/APNs/Mozilla autopush are on the public internet). Fixed by adding
# `edge` to api/worker/scheduler rather than removing `internal: true` from `app` —
# the data-tier isolation goal was correct, it was just applied one tier too high.
networks:
  edge: {}
  app: { internal: true }
  data: { internal: true }
volumes:
  postgres_data: {}
  redis_data: {}
  caddy_data: {}
  caddy_config: {}
  avatar_data: {}
