name: release-validation
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions: { contents: read }
concurrency:
  group: release-validation-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: { fetch-depth: 0 }
      - name: Validate release version
        run: python infrastructure/scripts/validate_version.py
      - name: Prepare test configuration
        run: cp .env.example .env && sed -i 's/replace-with-at-least-32-cryptographically-random-characters/release-only-secret-with-more-than-thirty-two-characters/' .env && sed -i 's/replace-with-a-random-admin-password/release-admin-password/' .env && sed -i 's/replace-with-a-random-migration-password/release-migration-password/' .env && sed -i 's/replace-with-a-different-random-runtime-password/release-runtime-password/' .env
      - name: Quality checks
        run: docker compose config --quiet && make test && make lint && make typecheck
      - name: Validate Alembic heads
        run: docker compose run --rm migrate alembic heads | tee /tmp/alembic-heads.txt && test "$(grep -c '(head)' /tmp/alembic-heads.txt)" -eq 1
      - name: Build production images
        run: docker compose build web api worker scheduler migrate
      - name: Shut down
        if: always()
        run: docker compose --profile tools down -v
