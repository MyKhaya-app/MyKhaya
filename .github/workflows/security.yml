name: security
on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
  schedule: [{ cron: "17 4 * * 1" }]
permissions: { contents: read, security-events: write }
concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true
jobs:
  # Independent jobs (not steps) so one scanner failing doesn't hide whether
  # the others also failed — GitHub reports each as its own check, instead of
  # the old single sequential job stopping at the first red step and leaving
  # every later scanner's status unknown. `security-gate` below requires all
  # of them via `needs:`, so the overall run still cannot report success
  # unless every scanner genuinely passed.
  secrets:
    runs-on: ubuntu-24.04
    steps:
      # fetch-depth: 0 is required, not cosmetic — Gitleaks scans full git
      # history by default (repository policy, not --no-git), and
      # .gitleaksignore entries are exact commit:file:rule:line fingerprints.
      # A shallow (default depth-1) checkout makes every present-tree finding
      # get attributed to the shallow clone's synthetic single commit instead
      # of the real historical commit, so legitimate fingerprint ignores stop
      # matching and Gitleaks fails on findings that are already reviewed.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - name: Secrets
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.28.0 detect --source=/repo --no-banner
  python-dependencies:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Python dependencies
        run: docker run --rm -v "$PWD/apps/api:/src" -w /src python:3.13.18-slim-bookworm sh -c "python -m pip install --upgrade pip && pip install . pip-audit && pip-audit"
  filesystem:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Filesystem dependencies and configuration
        run: docker run --rm -v "$PWD:/src" aquasec/trivy:0.64.1 fs --exit-code 1 --severity HIGH,CRITICAL --scanners vuln,misconfig /src
  semgrep:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Static analysis
        run: docker run --rm -v "$PWD:/src" semgrep/semgrep:1.172.0 semgrep scan --config p/owasp-top-ten --error /src/apps
  checkov:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Dockerfile and GitHub Actions IaC
        # `docker_compose` is not (and, checked against the current latest
        # checkov 3.3.10 too, never currently is) a valid --framework value —
        # confirmed by direct invocation, not assumed; Checkov has no distinct
        # Compose-file scanning capability in any presently available
        # version, so keeping that token here was a hard CLI-parse failure
        # that broke this whole step, dockerfile/github_actions included.
        # This is a real tool capability gap, not a config typo — see the
        # release report for what compose.yml/compose.*.yml coverage this
        # leaves unaddressed.
        run: docker run --rm -v "$PWD:/src" bridgecrew/checkov:3.2.451 -d /src --framework dockerfile github_actions --quiet
  sbom:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: SBOM
        run: docker run --rm -v "$PWD:/src" anchore/syft:v1.30.0 dir:/src -o cyclonedx-json=/src/mykhaya-sbom.cdx.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with: { name: mykhaya-sbom, path: mykhaya-sbom.cdx.json, retention-days: 30 }
  # Scans the images we actually ship (the API image also runs the worker,
  # scheduler and migrations), which `filesystem` above cannot see: OS packages
  # come from the base image and apt, not from files in the repository.
  # Two passes over each image, nothing suppressed:
  #   1. a complete report (every severity, fixed or not) published as an
  #      artifact for triage, so findings without an upstream fix stay visible;
  #   2. the gate, failing on any HIGH/CRITICAL finding that has a fix
  #      available. A finding with no released fix can't be remediated by an
  #      update; it is tracked from the report under
  #      docs/engineering/ci-security-scanning.md rather than ignored.
  container-image:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: api, dockerfile: apps/api/Dockerfile, target: runtime }
          - { name: web, dockerfile: apps/web/Dockerfile, target: "" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build ${{ matrix.name }} image
        env:
          DOCKERFILE: ${{ matrix.dockerfile }}
          TARGET: ${{ matrix.target }}
          IMAGE: mykhaya-${{ matrix.name }}:scan
        run: docker build -f "$DOCKERFILE" ${TARGET:+--target "$TARGET"} -t "$IMAGE" .
      - name: Full vulnerability report (all severities, nothing suppressed)
        env:
          IMAGE: mykhaya-${{ matrix.name }}:scan
          NAME: ${{ matrix.name }}
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD:/out" \
            aquasec/trivy:0.64.1 image --scanners vuln --format json -o "/out/trivy-$NAME.json" "$IMAGE"
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.64.1 image --scanners vuln --severity HIGH,CRITICAL --format table "$IMAGE"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ always() }}
        with: { name: "trivy-image-${{ matrix.name }}", path: "trivy-${{ matrix.name }}.json", retention-days: 30 }
      - name: Gate on fixable HIGH/CRITICAL vulnerabilities
        env:
          IMAGE: mykhaya-${{ matrix.name }}:scan
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.64.1 image --scanners vuln --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed "$IMAGE"
  security-gate:
    runs-on: ubuntu-24.04
    if: ${{ always() }}
    needs: [secrets, python-dependencies, filesystem, semgrep, checkov, sbom, container-image]
    steps:
      - name: Require every security scanner to pass
        env:
          SECRETS_RESULT: ${{ needs.secrets.result }}
          PYTHON_DEPENDENCIES_RESULT: ${{ needs.python-dependencies.result }}
          FILESYSTEM_RESULT: ${{ needs.filesystem.result }}
          SEMGREP_RESULT: ${{ needs.semgrep.result }}
          CHECKOV_RESULT: ${{ needs.checkov.result }}
          SBOM_RESULT: ${{ needs.sbom.result }}
          CONTAINER_IMAGE_RESULT: ${{ needs.container-image.result }}
        run: |
          set -eu
          failed=0
          for result in \
            "secrets=${SECRETS_RESULT}" \
            "python-dependencies=${PYTHON_DEPENDENCIES_RESULT}" \
            "filesystem=${FILESYSTEM_RESULT}" \
            "semgrep=${SEMGREP_RESULT}" \
            "checkov=${CHECKOV_RESULT}" \
            "sbom=${SBOM_RESULT}" \
            "container-image=${CONTAINER_IMAGE_RESULT}"; do
            name="${result%%=*}"
            status="${result#*=}"
            if [ "$status" != "success" ]; then
              echo "Security scanner $name finished with status: $status"
              failed=1
            fi
          done
          if [ "$failed" -ne 0 ]; then
            exit 1
          fi
          echo "All security scans passed."
