name: quality
on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
permissions: { contents: read }
concurrency:
  group: quality-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  application:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - name: Validate VERSION
        run: python infrastructure/scripts/validate_version.py
      - name: Export build metadata
        run: |
          echo "MYKHAYA_VERSION=$(tr -d '\n\r' < VERSION)" >> "$GITHUB_ENV"
          echo "MYKHAYA_COMMIT_SHA=${GITHUB_SHA}" >> "$GITHUB_ENV"
          echo "MYKHAYA_BUILD_TIME=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_ENV"
          echo "MYKHAYA_BUILD_CHANNEL=development" >> "$GITHUB_ENV"
      - name: Prepare test configuration
        run: cp .env.example .env && sed -i 's/replace-with-at-least-32-cryptographically-random-characters/ci-only-secret-with-more-than-thirty-two-characters/' .env && sed -i 's/replace-with-a-random-admin-password/ci-admin-password/' .env && sed -i 's/replace-with-a-random-migration-password/ci-migration-password/' .env && sed -i 's/replace-with-a-different-random-runtime-password/ci-runtime-password/' .env
      - name: Compose validation
        # Exercises the exact three environments documented in
        # docs/operations/local-development.md / dev-deployment.md / deployment.md.
        # `config --quiet` only checks syntax; `make up`/`make init`'s own step of
        # copying compose.override.yml.example is replicated here so local dev is
        # validated as it's actually resolved (not silently skipped because
        # compose.override.yml, gitignored, doesn't exist on a CI runner), and the
        # port-publish check catches a stack that resolves cleanly but is silently
        # unreachable from a browser — the actual regression this step exists for.
        run: |
          cp compose.override.yml.example compose.override.yml
          docker compose config --quiet
          docker compose config --format json | python3 infrastructure/scripts/check_caddy_port_published.py "local dev"
          rm compose.override.yml
          docker compose -f compose.yml -f compose.dev.yml config --quiet
          docker compose -f compose.yml -f compose.dev.yml config --format json | python3 infrastructure/scripts/check_caddy_port_published.py "persistent dev server"
          docker compose -f compose.yml -f compose.production.yml config --quiet
          docker compose -f compose.yml -f compose.production.yml config --format json | python3 infrastructure/scripts/check_caddy_port_published.py "production"
      - name: Development deployment validation
        run: |
          python -m unittest discover -s infrastructure/tests -v
          docker run --rm \
            -e MYKHAYA_DEV_PROXY_TRUSTED_CIDRS=100.64.0.0/10 \
            -v "$PWD/infrastructure/caddy/Caddyfile.dev:/etc/caddy/Caddyfile:ro" \
            caddy:2.10.0-alpine caddy validate --config /etc/caddy/Caddyfile
      - name: Alembic head validation
        run: docker compose run --rm migrate alembic heads | tee /tmp/alembic-heads.txt && test "$(grep -c '(head)' /tmp/alembic-heads.txt)" -eq 1
      - name: Web lint, type check, tests and build
        run: docker build --target check -f apps/web/Dockerfile .
      - name: Mobile lint and type check
        run: docker build --target mobile-check -f apps/web/Dockerfile .
      - name: API lint, formatting, types and tests
        run: docker compose --profile tools run --rm test sh -c 'ruff check mykhaya tests && ruff format --check mykhaya tests && mypy mykhaya && python -m pytest'
      - name: Production images
        run: docker compose build web api worker scheduler migrate
      - name: Migration rollback smoke test
        run: docker compose run --rm migrate sh -c 'alembic downgrade base && alembic upgrade head'
      - name: Shut down
        if: always()
        run: docker compose --profile tools down -v
