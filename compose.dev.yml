x-dev-api-environment: &dev-api-environment
  MYKHAYA_ENVIRONMENT: development
  MYKHAYA_BUILD_CHANNEL: development
  MYKHAYA_REGISTRATION_MODE: open
  # false (not true) because this dev stack is reachable two ways: the HTTPS tunnel
  # (dev.mykhaya.app, for phone testing) and plain http://localhost:8089 directly on
  # the Docker host. A Secure cookie is dropped by the browser over plain HTTP, so it
  # must be off here for local access to work at all — it still works fine over the
  # tunnel's HTTPS regardless, Secure is an extra restriction, not a requirement.
  # compose.production.yml has its own independent (and strict) cookie/CORS settings.
  MYKHAYA_COOKIE_SECURE: "true"
  MYKHAYA_PUBLIC_WEB_URL: https://dev.mykhaya.app
  MYKHAYA_ADMIN_URL: https://admin.dev.mykhaya.app
  MYKHAYA_STATUS_URL: https://status.dev.mykhaya.app
  # Direct-to-API origin for native/bearer clients. Keep this aligned with the
  # public dev route in Caddyfile.dev; the base Compose default is local-only.
  MYKHAYA_NATIVE_API_URL: https://api.dev.mykhaya.app
  # Both access paths: the HTTPS tunnel for phone testing, and plain localhost/127.0.0.1
  # for working directly against the Docker host. 8089 (not 8080) because 8080 is
  # already in use by another app on this machine.
  MYKHAYA_CORS_ORIGINS: '["https://dev.mykhaya.app","https://admin.dev.mykhaya.app","https://status.dev.mykhaya.app","http://localhost:8089","http://127.0.0.1:8089"]'
  MYKHAYA_TRUSTED_HOSTS: '["dev.mykhaya.app","admin.dev.mykhaya.app","status.dev.mykhaya.app","api.dev.mykhaya.app","localhost","127.0.0.1","api"]'
  # Pinned to Caddy's own exact, static addresses on the `edge`/`app`
  # networks below (each network's own gateway plus every other container's
  # auto-assigned address are deliberately NOT included) — see the
  # `networks:`/`caddy.networks` block's comment for the full rationale,
  # including why trusting the whole subnet (an earlier draft of this fix)
  # was still spoofable via the network's own gateway address.
  MYKHAYA_TRUSTED_PROXY_CIDRS: '${MYKHAYA_TRUSTED_PROXY_CIDRS:-["10.77.0.250/32","10.77.1.250/32"]}'
  MYKHAYA_ADMIN_ALLOWED_NETWORKS: '${MYKHAYA_ADMIN_ALLOWED_NETWORKS:-["100.64.0.0/10"]}'
  MYKHAYA_ADMIN_MFA_REQUIRED: "true"
  MYKHAYA_DEFAULT_TIMEZONE: "${MYKHAYA_DEFAULT_TIMEZONE:-Europe/London}"
  MYKHAYA_DEFAULT_LOCALE: "${MYKHAYA_DEFAULT_LOCALE:-en-GB}"
  MYKHAYA_WEEK_START: "${MYKHAYA_WEEK_START:-monday}"

services:
  caddy:
    ports:
      - "${MYKHAYA_DEV_BIND_ADDRESS:-0.0.0.0}:${MYKHAYA_DEV_HOST_PORT:-8089}:8080"
    environment:
      MYKHAYA_DEV_PROXY_TRUSTED_CIDRS: "${MYKHAYA_DEV_PROXY_TRUSTED_CIDRS:-100.64.0.0/10}"
    # Deliberately high (.250, not .2/.3/...) so it never collides with the
    # low addresses Docker auto-assigns to api/web/worker/scheduler/migrate
    # in whatever order they happen to start — see the `networks:` block
    # below for why a static IP is needed here at all.
    networks:
      edge:
        ipv4_address: 10.77.0.250
      app:
        ipv4_address: 10.77.1.250
    volumes:
      - "./infrastructure/caddy/Caddyfile.dev:/etc/caddy/Caddyfile:ro"
      - "caddy_data:/data"
      - "caddy_config:/config"
  api:
    environment:
      <<: *dev-api-environment
      MYKHAYA_APNS_DELIVERY_CONFIGURED: "false"
  web:
    environment:
      MYKHAYA_ENVIRONMENT: development
      MYKHAYA_BUILD_CHANNEL: development
  worker:
    environment:
      <<: *dev-api-environment
      MYKHAYA_DATABASE_URL: "postgresql+asyncpg://mykhaya_app:${MYKHAYA_DB_PASSWORD}@postgres:5432/mykhaya"
      MYKHAYA_APNS_DELIVERY_CONFIGURED: "${MYKHAYA_APNS_DELIVERY_CONFIGURED:-false}"
      MYKHAYA_APNS_TEAM_ID: "${MYKHAYA_APNS_TEAM_ID:-}"
      MYKHAYA_APNS_KEY_ID: "${MYKHAYA_APNS_KEY_ID:-}"
      MYKHAYA_APNS_BUNDLE_ID: "${MYKHAYA_APNS_BUNDLE_ID:-app.mykhaya.mobile}"
      MYKHAYA_APNS_PRIVATE_KEY: "${MYKHAYA_APNS_PRIVATE_KEY:-}"
  scheduler:
    environment:
      <<: *dev-api-environment
      MYKHAYA_APNS_DELIVERY_CONFIGURED: "false"
  migrate:
    environment:
      <<: *dev-api-environment
      MYKHAYA_APNS_DELIVERY_CONFIGURED: "false"
  mailpit:
    ports:
      - "127.0.0.1:${MYKHAYA_DEV_MAILPIT_PORT:-8025}:8025"

# Pin the `edge`/`app` subnets compose.yml declares with no `ipam`, purely so
# caddy above can be given a static, known-in-advance address on each — that
# static /32 (not the subnet itself) is what MYKHAYA_TRUSTED_PROXY_CIDRS
# actually trusts. Trusting the whole subnet was tried and rejected: `edge`
# is non-internal (it needs a real gateway for api/worker/scheduler's
# outbound SMTP/APNs/FCM traffic), and that gateway address — the address
# Docker's own NAT makes ALL host-published-port traffic appear to originate
# from — sits inside that same subnet. A chain-walking client-IP resolver
# (mykhaya.security.resolve_client_ip) that trusted the whole /24 would
# therefore treat the gateway as just another trusted hop and keep walking
# an attacker-supplied X-Forwarded-For chain straight past it — confirmed
# live with a forged header before switching to the /32-per-container form
# below. Both networks are pinned (not just `edge`, which Caddy's connection
# to `api` is currently observed to use — confirmed via `docker logs`/
# `request.client`), because which of a multi-homed container's networks
# Docker's embedded DNS/routing picks for outbound connections is an
# implementation detail of container attach order, not a documented
# contract. `data` is deliberately left unpinned: it never carries the
# Caddy->api hop this trust boundary is about. See
# docs/architecture/deployment-model.md.
networks:
  edge:
    ipam:
      config:
        - subnet: 10.77.0.0/24
  app:
    ipam:
      config:
        - subnet: 10.77.1.0/24
