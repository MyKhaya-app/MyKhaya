name: mykhaya
# Isolated, disposable test stack: dedicated postgres-test/redis-test services on
# tmpfs, never the persistent postgres/redis used by api/worker/scheduler. Always
# run through infrastructure/scripts/run-tests.sh (or `make test`/`lint`/`typecheck`/
# `format`), which starts these with --no-deps so the base `migrate`/`redis`
# dependencies declared on the `test` service in compose.yml are never triggered.
# See docs/operations/dev-deployment.md#automated-tests-use-an-isolated-database.
services:
  postgres-test:
    image: postgres:17.5-alpine3.22
    env_file: [.env]
    environment:
      {
        POSTGRES_DB: mykhaya,
        POSTGRES_USER: postgres,
        POSTGRES_PASSWORD: "${MYKHAYA_POSTGRES_ADMIN_PASSWORD}",
      }
    volumes:
      [
        "./infrastructure/docker/init-db.sh:/docker-entrypoint-initdb.d/10-init.sh:ro",
      ]
    tmpfs: ["/var/lib/postgresql/data"]
    networks: [data]
    healthcheck:
      {
        test: [CMD-SHELL, "pg_isready -U postgres -d mykhaya"],
        interval: 2s,
        timeout: 3s,
        retries: 30,
      }
    security_opt: [no-new-privileges:true]
  redis-test:
    image: redis:8.0.3-alpine3.21
    tmpfs: ["/data"]
    networks: [data]
    healthcheck:
      { test: [CMD, redis-cli, ping], interval: 2s, timeout: 3s, retries: 30 }
    restart: "no"
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    security_opt: [no-new-privileges:true]
  migrate-test:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    env_file: [.env]
    environment:
      {
        MYKHAYA_DATABASE_URL: "postgresql+asyncpg://mykhaya_migrator:${MYKHAYA_MIGRATION_DB_PASSWORD}@postgres-test:5432/mykhaya",
      }
    command: ["alembic", "upgrade", "head"]
    networks: [data]
    restart: "no"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
  test:
    environment:
      {
        MYKHAYA_DATABASE_URL: "postgresql+asyncpg://mykhaya_app:${MYKHAYA_DB_PASSWORD}@postgres-test:5432/mykhaya",
        MYKHAYA_REDIS_URL: "redis://redis-test:6379/0",
      }
