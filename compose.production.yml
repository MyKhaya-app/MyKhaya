services:
  caddy:
    ports: ["80:80"]
    environment:
      WEB_DOMAIN: "${WEB_DOMAIN:?Set WEB_DOMAIN in the production .env}"
      API_DOMAIN: "${API_DOMAIN:?Set API_DOMAIN in the production .env}"
      ADMIN_DOMAIN: "${ADMIN_DOMAIN:?Set ADMIN_DOMAIN in the production .env}"
      STATUS_DOMAIN: "${STATUS_DOMAIN:?Set STATUS_DOMAIN in the production .env}"
      MYKHAYA_CADDY_TRUSTED_PROXY_CIDRS: "${MYKHAYA_CADDY_TRUSTED_PROXY_CIDRS:?Set exact NetBird/Cloudflare proxy CIDRs in production .env}"
    volumes:
      [
        "./infrastructure/caddy/Caddyfile.production:/etc/caddy/Caddyfile:ro",
        "caddy_data:/data",
        "caddy_config:/config",
      ]
  api:
    environment: &production_api_environment
      MYKHAYA_ENVIRONMENT: production
      # Stable is a production invariant; the release script also exports it
      # before builds so image labels and runtime metadata agree.
      MYKHAYA_BUILD_CHANNEL: stable
      MYKHAYA_COOKIE_SECURE: "true"
      MYKHAYA_ADMIN_MFA_REQUIRED: "true"
  worker:
    environment: *production_api_environment
  scheduler:
    environment: *production_api_environment
  migrate:
    environment: *production_api_environment
  mailpit:
    profiles: [development-only]

volumes:
  home_migration_data:
    name: mykhaya_prod_home_migration_data
